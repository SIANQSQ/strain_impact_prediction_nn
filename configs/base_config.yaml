# 数据配置 - 按事件分组
data:
  # 输入文件路径
  input_csv: "data/raw/strain_data.csv"
  
  # 数据列名配置
  event_id_column: "event_id"           # 事件ID列名
  time_column: "time_step"              # 时间步列名
  feature_columns: ["strain_top", "strain_bottom", "strain_left", "strain_right"]  # 特征列
  label_columns: ["force_x", "force_y", "force_magnitude"]  # 标签列
  
  # 序列参数
  sequence_length: 100                   # 每个事件的固定时间步数
  pad_mode: "edge"                      # 填充模式: edge, zero, mean, constant
  truncate_mode: "end"                  # 截断模式: start, end, random
  
  # 数据集划分
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  
  # 数据处理
  normalize: true
  add_derived_features: false
  shuffle: true

# 模型配置（保持不变）
model:
  model_type: "CNN_LSTM"
  cnn_channels: [32, 64, 128]
  cnn_kernel_sizes: [3, 3, 3]
  cnn_padding: "same"
  cnn_dropout: 0.2
  
  lstm_hidden_size: 128
  lstm_num_layers: 2
  lstm_bidirectional: true
  lstm_dropout: 0.3
  
  mlp_hidden_layers: [256, 128, 64]
  mlp_dropout: 0.3
  
  position_head_hidden: [64, 32]
  force_head_hidden: [64, 32]
  
  weight_init: "xavier_normal"

# 训练配置（保持不变）
training:
  epochs: 200
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  
  loss_weights:
    position: 0.6
    force: 0.4
    
  optimizer: "AdamW"
  scheduler: "ReduceLROnPlateau"
  scheduler_patience: 10
  scheduler_factor: 0.5
  min_lr: 1e-6
  
  gradient_clip: 1.0
  patience: 20
  min_delta: 0.001
  
  dropout: 0.3
  batch_norm: true

# 实验配置（保持不变）
experiment:
  name: "event_strain_to_force_experiment"
  save_model: true
  save_checkpoints: true
  checkpoint_frequency: 10
  use_tensorboard: true
  log_dir: "logs"
  verbose: true
  save_predictions: true
  save_figures: true
  figure_dpi: 150